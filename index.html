<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まもれてない地図</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);
  transition:background .2s ease,color .2s ease;padding-bottom:88px;-webkit-text-size-adjust:100%}
body.gate{padding-bottom:0;display:flex;align-items:center;justify-content:center;min-height:100dvh}
body.tex-dot{image-rendering:pixelated}
body.tex-kougo{background-image:
  repeating-linear-gradient(0deg,var(--edge) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,var(--edge) 0 1px,transparent 1px 28px)}
body.tex-kami{background-image:
  radial-gradient(circle at 20% 30%,var(--edge) .6px,transparent .7px),
  radial-gradient(circle at 70% 65%,var(--edge) .5px,transparent .6px);background-size:13px 13px,19px 19px}
body.tex-sousa{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 4px)}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 0}

/* ---- 表紙 ---- */
.gatewrap{width:100%;max-width:400px;padding:24px 20px;margin:auto;text-align:center}
.gatemap{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:150px;margin:0 auto 24px}
.gatemap i{aspect-ratio:1.2/1;border:1px solid var(--edge);border-radius:4px;background:var(--frontier)}
.gatemap i.on{background:var(--accent);border-color:var(--accent)}
.gatetitle{font-size:30px;font-weight:800;letter-spacing:.02em;margin:0 0 10px;line-height:1.25}
.gatelead{font-size:13.5px;line-height:1.9;color:var(--dim);margin:0 0 26px}
.gatelead b{color:var(--accent);font-weight:800}
.gatewrap label{text-align:left}
.gatefoot{font-size:10.5px;color:var(--dim);line-height:1.9;margin-top:20px}
.gatefoot button{background:none;border:0;color:var(--accent2);font-size:10.5px;cursor:pointer;padding:0;text-decoration:underline}

/* ---- ヘッダ ---- */
.bar{display:flex;align-items:center;gap:6px;padding:2px 0 10px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.brand small{display:block;font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.spacer{flex:1}
button{font-family:inherit}
.ghost{background:none;border:1.5px solid var(--edge);color:var(--dim);border-radius:99px;
  padding:6px 11px;font-size:11px;cursor:pointer;font-weight:600}
.ghost:hover{color:var(--ink);border-color:var(--accent)}

/* ---- ヒーロー ---- */
.hero{background:var(--panel);border:1.5px solid var(--edge);border-radius:16px;padding:13px 14px;margin-bottom:10px}
body.tex-dot .hero{border-radius:0;box-shadow:3px 3px 0 var(--edge)}
.herotop{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.herotop b{font-size:15px;font-weight:800}
.herotop em{font-style:normal;font-size:11.5px;color:var(--dim);margin-left:auto}
.bigbar{display:flex;gap:3px;height:14px}
.bigbar i{flex:1;background:var(--frontier);border-radius:3px;border:1px solid var(--edge)}
.bigbar i.f1{background:color-mix(in srgb,var(--accent) 35%,var(--frontier));border-color:transparent}
.bigbar i.f2{background:color-mix(in srgb,var(--accent) 60%,var(--frontier));border-color:transparent}
.bigbar i.f3{background:color-mix(in srgb,var(--accent) 82%,var(--frontier));border-color:transparent}
.bigbar i.f4{background:var(--accent);border-color:transparent}
.herofoot{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.7}
.herofoot b{color:var(--ink)}

/* ---- レンズ ---- */
.lensblock{margin-bottom:10px}
.lenslabel{font-size:10px;color:var(--dim);letter-spacing:.14em;margin:8px 0 5px;font-weight:700}
.lensrow{display:flex;flex-wrap:wrap;gap:5px}
.lens{border:1.5px solid var(--edge);background:var(--panel);color:var(--dim);
  border-radius:99px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
.lens[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--onaccent)}

/* ---- 盤面 ---- */
.boardbox{background:var(--panel);border:1.5px solid var(--edge);border-radius:16px;padding:10px 10px 8px}
body.tex-dot .boardbox{border-radius:0;box-shadow:3px 3px 0 var(--edge)}
.grid{display:grid;gap:4px}
.hd{font-size:11.5px;font-weight:700;color:var(--dim);display:flex;align-items:flex-end;
  justify-content:center;text-align:center;padding-bottom:3px;line-height:1.2}
.rowhd{font-size:11.5px;font-weight:700;color:var(--dim);display:flex;align-items:center;
  justify-content:flex-end;padding-right:5px;text-align:right;line-height:1.25}
.cell{aspect-ratio:1.3/1;max-height:66px;border:1.5px solid var(--edge);border-radius:9px;
  background:var(--frontier);cursor:pointer;padding:4px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-end;transition:transform .1s ease;overflow:hidden}
body.tex-dot .cell{border-radius:0;box-shadow:2px 2px 0 var(--edge)}
.cell:hover{transform:translateY(-2px)}
.cell:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.cell .qmark{font-size:10px;line-height:1;align-self:flex-start}
.cell .gauge{display:flex;gap:1.5px;width:100%;margin-top:auto}
.cell .gauge i{flex:1;height:4px;border-radius:2px;background:var(--onfill);opacity:.28}
.cell .gauge i.on{opacity:1}
.cell.f1{background:color-mix(in srgb,var(--accent) 30%,var(--frontier));border-color:transparent}
.cell.f2{background:color-mix(in srgb,var(--accent) 55%,var(--frontier));border-color:transparent}
.cell.f3{background:color-mix(in srgb,var(--accent) 78%,var(--frontier));border-color:transparent}
.cell.f4{background:var(--accent);border-color:transparent}
.cell.new{background:transparent;border-style:dashed;opacity:.45}
body.picking .cell{outline:2px dashed var(--accent2);outline-offset:-3px}
.pickbanner{background:var(--accent);color:var(--onaccent);border-radius:12px;padding:9px 13px;
  font-size:12.5px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.pickbanner button{margin-left:auto;background:none;border:1.5px solid var(--onaccent);
  color:var(--onaccent);border-radius:99px;padding:4px 10px;font-size:11px;cursor:pointer}
.pulse{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:10px 2px 2px;font-size:10px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid var(--edge)}
.note{font-size:10.5px;color:var(--dim);text-align:center;padding:7px 4px 0;line-height:1.7}

/* ---- ポップアップ（中央） ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
  justify-content:center;z-index:40;padding:14px}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:520px;max-height:86vh;
  display:flex;flex-direction:column;border-radius:18px;border:1.5px solid var(--edge);overflow:hidden}
body.tex-dot .sheet{border-radius:0}
.sheetbody{overflow-y:auto;padding:18px}
.sheetfoot{border-top:1.5px solid var(--edge);padding:11px 14px;display:flex;gap:8px;background:var(--panel)}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
.sheet .sub{font-size:11.5px;color:var(--dim);margin:0 0 12px;line-height:1.7}
label{display:block;font-size:11px;color:var(--dim);margin:13px 0 4px;letter-spacing:.05em;font-weight:700}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--edge);
  border-radius:11px;padding:10px;font-size:16px;font-family:inherit}
body.tex-dot input,body.tex-dot textarea{border-radius:0}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.primary{flex:1;background:var(--accent);color:var(--onaccent);border:0;border-radius:99px;
  padding:13px;font-size:14.5px;font-weight:800;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.cancel{background:none;border:1.5px solid var(--edge);color:var(--dim);border-radius:99px;
  padding:13px 18px;font-size:13px;cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--edge);background:var(--bg);color:var(--dim);border-radius:99px;
  padding:7px 12px;font-size:12px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--onaccent)}
.chip.warn{border-color:var(--accent2)}
.sw{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-2px}
.card{border-top:1.5px solid var(--edge);padding:12px 0}
.raw{font-size:13px;line-height:1.7;margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.src{font-size:10.5px;color:var(--dim);word-break:break-all;line-height:1.65}
.src a{color:var(--accent2)}
.srclist{margin:0;padding:0;list-style:none}
.judge{border:1.5px dashed var(--edge);border-radius:11px;padding:8px 10px;margin:8px 0;font-size:11.5px;line-height:1.6}
.judge b{color:var(--ink)}
.judge .why{color:var(--dim);display:block;margin-top:3px}
.judge .fixed{color:var(--accent2);font-weight:800}
.take{background:var(--accent2);color:var(--onaccent2);border:0;border-radius:99px;
  padding:7px 13px;font-size:11.5px;cursor:pointer;font-weight:700;margin-top:7px}
.take:disabled{opacity:.4;cursor:not-allowed}
.meter{display:flex;gap:3px;margin:9px 0 5px}
.meter i{flex:1;height:8px;background:var(--frontier);border-radius:3px}
.meter i.on{background:var(--accent)}
.qbox{background:var(--bg);border-left:3px solid var(--accent2);border-radius:9px;
  padding:9px 11px;margin-bottom:7px;font-size:12.5px;line-height:1.6}
.qbox .meta{font-size:10px;color:var(--dim);margin-top:3px}
.rule{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:8px 0;border-bottom:1px dotted var(--edge);line-height:1.5}
.rule b{color:var(--accent);font-weight:800;white-space:nowrap}
.unlock{background:var(--bg);border:1.5px solid var(--accent);border-radius:12px;padding:11px 13px;
  font-size:12.5px;line-height:1.7;margin:12px 0}
.fab{position:fixed;right:14px;bottom:14px;background:var(--accent);color:var(--onaccent);border:0;
  border-radius:99px;padding:15px 24px;font-size:15px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.22);z-index:20}
body.tex-dot .fab{border-radius:0;box-shadow:4px 4px 0 var(--edge)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--panel);
  color:var(--ink);border:1.5px solid var(--accent);border-radius:14px;padding:11px 16px;
  font-size:12.5px;z-index:50;max-width:92vw;line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.empty{font-size:12px;color:var(--dim);line-height:1.8;padding:6px 2px}
.err{color:var(--accent);font-size:12px;line-height:1.7;margin-top:10px;font-weight:600}
.radio{display:flex;align-items:flex-start;gap:8px;padding:8px 0;font-size:13px;line-height:1.5;cursor:pointer}
.radio input{width:auto;flex:0 0 auto;margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============================================================

   ============================================================ */
var GAS_URL = "https://script.google.com/macros/s/AKfycbxVSsOIo-h4bIrbced-ehK_9iDYixnT1ae09iKXIg-S-HiE4BcIvh1cDFxZRxJEnPbszQ/exec";

/* ============================================================
   ↓ ② 名前とことば。ここだけ直せば全画面が変わります。
      （最終的には、メンバー自身に決めてもらうことをおすすめします）
   ============================================================ */
var BRAND = {
  title: "まもれてない地図",

  lead:  "災害のとき、女の子や女の人が困ることを調べて、地図に置いていく。<br><b>白いところは、まだ誰も守れていない場所。</b>",

};

var SEED = {

    {id:"d4",label:"安全"},{id:"d5",label:"性別役割"},{id:"d6",label:"お金と仕事"},
    {id:"d7",label:"決める場"},{id:"d8",label:"復興期の関係"}],
  axes:[{id:"a1",label:"平時"},{id:"a2",label:"直後"},{id:"a3",label:"避難生活"},{id:"a4",label:"復興期"}],
  stages:[{id:"s1",label:"学齢・思春期"},{id:"s2",label:"就労期"},{id:"s3",label:"妊娠・出産期"},

    {id:"g4",label:"性的マイノリティ"},{id:"g5",label:"外国籍"},{id:"g6",label:"ケアの担い手"}],
  themes:[
    {id:"momo",   label:"ももソーダ",   bg:"#FFF0F5",accent:"#FF4F87"},
    {id:"lemon",  label:"レモネード",   bg:"#FFFBEA",accent:"#FFA400"},
    {id:"mint",   label:"ミントソーダ", bg:"#EBFBF5",accent:"#00C39A"},
    {id:"lavender",label:"ラベンダー",  bg:"#F3F0FF",accent:"#7C5CFF"},
    {id:"sora",   label:"そらいろ",     bg:"#EDF6FF",accent:"#2E9BFF"},
    {id:"neon",   label:"ネオン",       bg:"#12101C",accent:"#FF57C8"},
    {id:"yozora", label:"よぞら",       bg:"#141A32",accent:"#FFC46B"},
    {id:"hakuboku",label:"白墨",        bg:"#F7F7F5",accent:"#333330"}],
  fonts:[{id:"maru",label:"丸ゴシック",stack:'"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif',url:""},
    {id:"gothic",label:"ゴシック",stack:'"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif',url:""},
    {id:"mincho",label:"明朝",stack:'"Hiragino Mincho ProN","Yu Mincho",serif',url:""},
    {id:"tohaba",label:"等幅",stack:'ui-monospace,Menlo,"Osaka-Mono",monospace',url:""}]
};
var TEXTURES={flat:"フラット",dot:"ドット",kougo:"方眼",kami:"紙",sousa:"走査線"};

var LEVELS=[
  {lv:1,need:0,  key:"lv.1",title:"しらべる",  unlock:"カードを出す／AIの判定を直す"},
  {lv:2,need:30, key:"lv.2",title:"読み合う",  unlock:"ほかの人のカードにコメントできる"},
  {lv:3,need:80, key:"lv.3",title:"問いを立てる",unlock:"地図に新しい領域・時期・ライフステージを足せる"},
  {lv:4,need:160,key:"lv.4",title:"まとめる",  unlock:"マスの要約を書いて「まとまった」にできる"},
  {lv:5,need:280,key:"lv.5",title:"場をつくる",unlock:"ワークショップを企画・外部で発表できる"}
];
var POINT_RULES=[
  ["カードを1枚出す","+10"],
  ["まだ誰もいないマスに最初に置く","+15"],
  ["1〜2枚しかないマスに足す","+5"],
  ["誰かの「わからない」に答える","+12"],
  ["自分の「わからない」に誰かが答える","+8"],
  ["AIの判定を直す","+5"]
];
var FILL=["まだ白い","1人が見た","何人か見た","しっかり調べた","まとまった"];
var REASONS=["本文にその話は出てこない","触れているけど中心じゃない","別のステージと取りちがえてる",
  "この区分に当てはまらない","その他"];

var TEXTS={
  "card.src":{y:"① どこで みた？（URL・いくつでも）",n:"① どこで見た？（URL・複数可）"},
  "card.srcnote":{y:"かいぎょう・スペース・、 で わけて OK。あとから だれも しらべなおせません。",
                  n:"改行・スペース・カンマ（、，,）どれで区切ってもOK。出どころは、あとから誰にも復元できません。"},
  "card.raw":{y:"② しらべたこと（コピペで OK）",n:"② 調べたこと（そのまま貼ってOK）"},
  "card.q":{y:"③ わからなかったこと（あれば）",n:"③ わからなかったこと（あれば）"}
};

var mem={};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
        set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};

var data={domains:SEED.domains,axes:SEED.axes,stages:SEED.stages,situations:SEED.situations,
  cards:[],summaries:{},echoes:[],themes:SEED.themes,fonts:SEED.fonts,texts:{},fixCounts:{}};
var me={name:"",theme:"momo",font:"maru",texture:"flat",lang:"n",pass:""};
var lens={type:"all",id:""};
var modal=null,flash="",picking=false,loadErr="",loadedFonts={},authed=false,gateErr="",gateBusy=false;

function loadMe(){
  var r=LS.get("rfl4_me"); if(r){try{me=Object.assign(me,JSON.parse(r))}catch(e){}}
  var u=LS.get("rfl4_gas"); if(u) GAS_URL=u;
  authed=LS.get("rfl4_authed")==="1"&&!!me.name&&!!me.pass;
}
function saveMe(){LS.set("rfl4_me",JSON.stringify(me))}
function T(k,def){
  var s=data.texts&&data.texts[k];
  if(s&&s[me.lang]) return s[me.lang];
  var d=TEXTS[k]; if(d) return d[me.lang]||d.n;
  return def!==undefined?def:k;
}
function lvTitle(l){ return T(l.key,l.title) }

/* ---------- 出典 ---------- */
function splitSources(t){
  var out=[];
  String(t||"").split(/[\n\r、，,]+/).forEach(function(seg){
    seg=seg.trim(); if(!seg) return;
    if((seg.match(/https?:\/\//gi)||[]).length>1){
      seg.split(/\s+/).forEach(function(p){p=p.trim();if(p)out.push(p)});
    } else out.push(seg);
  });
  return out;
}
function normUrl(u){
  var s=String(u||"").trim(); if(!s) return "";
  if(/^https?:\/\//i.test(s)){
    try{
      var x=new URL(s); x.hash="";
      var drop=[]; x.searchParams.forEach(function(v,k){if(/^utm_|^(fbclid|gclid|ref|source)$/i.test(k))drop.push(k)});
      drop.forEach(function(k){x.searchParams.delete(k)});
      var qs=x.searchParams.toString();
      return x.host.replace(/^www\./i,"").toLowerCase()+x.pathname.replace(/\/+$/,"")+(qs?"?"+qs:"");
    }catch(e){}
  }
  return s.toLowerCase().replace(/\s+/g," ");
}
function srcListOf(c){return c.srcs&&c.srcs.length?c.srcs:splitSources(c.src)}

/* ---------- 色 ---------- */
function hex2rgb(h){h=String(h).replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r){return "#"+r.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")}).join("")}
function mix(a,b,t){var x=hex2rgb(a),y=hex2rgb(b);return rgb2hex([0,1,2].map(function(i){return x[i]+(y[i]-x[i])*t}))}
function lum(h){var c=hex2rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){var l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2);return (hi+.05)/(lo+.05)}
function onColor(c){return lum(c)>0.5?"#1A1A1A":"#FFFFFF"}
function rotate(h,deg){
  var c=hex2rgb(h),r=c[0]/255,g=c[1]/255,b=c[2]/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,hh=0;
  if(d){hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hh*=60}
  var l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;
  hh=(hh+deg+360)%360;
  var C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((hh/60)%2-1)),m=l-C/2,p;
  if(hh<60)p=[C,X,0];else if(hh<120)p=[X,C,0];else if(hh<180)p=[0,C,X];
  else if(hh<240)p=[0,X,C];else if(hh<300)p=[X,0,C];else p=[C,0,X];
  return rgb2hex([(p[0]+m)*255,(p[1]+m)*255,(p[2]+m)*255]);
}
function palette(t){
  var bg=t.bg,ac=t.accent,dark=lum(bg)<0.35,far=dark?"#FFFFFF":"#000000";
  var a2=rotate(ac,-40);
  return {bg:bg,panel:mix(bg,far,dark?0.07:0.035),ink:mix(bg,far,dark?0.93:0.87),
    dim:mix(bg,far,0.48),edge:mix(bg,far,dark?0.2:0.13),frontier:mix(bg,far,dark?0.11:0.06),
    accent:ac,accent2:a2,onaccent:onColor(ac),onaccent2:onColor(a2),
    onfill:dark?"#FFFFFF":"#000000"};
}

/* ---------- 通信 ---------- */
function parseRes(r){
  return r.text().then(function(t){
    var s=t.trim();
    if(s.charAt(0)==="<")
      throw new Error("JSONではなくHTMLが返りました。GASの公開設定が「全員」か、URLの末尾が /exec か、スクリプトにエラーがないかを確認してください。");
    try{ return JSON.parse(s); }catch(e){ throw new Error("返事を読めませんでした"); }
  });
}
function api(action,payload){
  if(!GAS_URL) return Promise.reject(new Error("保存先が未設定です"));
  if(action==="get")
    return fetch(GAS_URL+"?pass="+encodeURIComponent(me.pass)+"&t="+Date.now()).then(parseRes)
      .then(function(j){if(j&&j.ok===false)throw new Error(j.error||"読み込めません");return j});
  return fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action:action,pass:me.pass,author:me.name},payload))})
    .then(parseRes).then(function(j){if(!j.ok)throw new Error(j.error||"保存に失敗");return j});
}
function pull(){
  return api("get").then(function(j){
    if(j&&j.domains){
      ["domains","axes","stages","situations","themes","fonts"].forEach(function(k){if(j[k]&&j[k].length)data[k]=j[k]});
      data.cards=j.cards||[];data.summaries=j.summaries||{};data.echoes=j.echoes||[];
      data.texts=j.texts||{};data.fixCounts=j.fixCounts||{};
      LS.set("rfl4_cache",JSON.stringify(data));loadErr="";
    }
    render();
  }).catch(function(e){loadErr=e.message;render()});
}

/* ---------- 計算 ---------- */
function inLens(c){
  if(lens.type==="all") return true;
  var l=lens.type==="stage"?(c.stages||[]):(c.situations||[]);
  if(l.indexOf(lens.id)<0) return false;
  if(c.conf==="低"&&!c.fixed) return false;
  return true;
}
function at(d,a){return data.cards.filter(function(c){return c.d===d&&c.a===a&&inLens(c)})}
function density(cards){
  var n=cards.length; if(!n) return {s:0,n:0,people:0,srcs:0};
  var people=new Set(cards.map(function(c){return c.author})).size;
  var set=new Set();
  cards.forEach(function(c){srcListOf(c).forEach(function(u){var k=normUrl(u);if(k)set.add(k)})});
  var srcs=set.size,sc=n+people*2+srcs*1.5;
  return {s:sc>=14?4:sc>=9?3:sc>=5?2:1,n:n,people:people,srcs:srcs};
}
function openQAt(d,a){
  var ans=new Set(data.cards.map(function(c){return c.answers}).filter(Boolean));
  return data.cards.filter(function(c){return c.d===d&&c.a===a&&c.q&&!ans.has(c.id)});
}
function nudge(z,hasSum){
  if(z.s===0) return "ここはまだ白いまま。最初の1枚を置くと +15。";
  if(z.people===1) return "いまは1人だけ。ほかの人が1枚足すと、ぐっと濃くなります。";
  if(z.srcs<3) return "出どころがあと"+(3-z.srcs)+"件増えると、しっかり調べた状態になります。";
  if(!hasSum&&z.s>=3) return "十分たまりました。Lv4の人が要約を書くと「まとまった」になります。";
  return "ここは外に出せる材料になっています。";
}
function myExp(){
  if(!me.name) return 0;
  var mine=data.cards.filter(function(c){return c.author===me.name});
  var e=mine.reduce(function(s,c){return s+(Number(c.pts)||0)},0);
  var ids=new Set(mine.map(function(c){return c.id}));
  e+=data.cards.filter(function(c){return c.answers&&ids.has(c.answers)}).length*8;
  e+=(data.fixCounts[me.name]||0)*5;
  return e;
}
function myLevel(){var e=myExp(),l=LEVELS[0];LEVELS.forEach(function(x){if(e>=x.need)l=x});return l}
function labelOf(list,id){var x=list.filter(function(v){return v.id===id})[0];return x?x.label:id}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function linkify(u){var s=esc(u);return /^https?:\/\//i.test(u)?'<a href="'+s+'" target="_blank" rel="noopener noreferrer">'+s+'</a>':s}
function cardById(id){return data.cards.filter(function(c){return c.id===id})[0]}
function loadFont(f){
  if(!f.url||loadedFonts[f.id])return;
  var l=document.createElement("link");l.rel="stylesheet";l.href=f.url;
  document.head.appendChild(l);loadedFonts[f.id]=true;
}
function applyTheme(){
  var t=data.themes.filter(function(x){return x.id===me.theme})[0]||data.themes[0];
  var p=palette(t),r=document.documentElement.style;
  Object.keys(p).forEach(function(k){r.setProperty("--"+k,p[k])});
  var f=data.fonts.filter(function(x){return x.id===me.font})[0]||data.fonts[0];
  loadFont(f);r.setProperty("--font",f.stack);
  document.body.className=(authed?"":"gate ")+"tex-"+me.texture+(picking?" picking":"");
}

function doEnter(){

  me.name=n;me.pass=p;gateBusy=true;gateErr="";renderGate();
  api("get").then(function(j){

    authed=true;saveMe();LS.set("rfl4_authed","1");pull();

    var k={addDomain:["新しい領域をひらく","最初の8つは、外の資料から借りたものです。ここから先は、あなたたちが見つけた困りごとの名前が入ります。","情報が届かない／ペットと避難"],
      addAxis:["新しい時期を足す","「平時→復興期」で足りないと思ったら、自分たちの時間軸に組みかえてください。","予兆期／2年後"],
      addStage:["ライフステージを足す","仮に7つ置いてあるだけ。区切り方そのものを決めなおせます。","受験期／留学中"]}[modal.t];
    body='<h3>'+k[0]+'</h3><p class="sub">'+k[1]+'</p><label>名前</label><input id="f_label" maxlength="14" placeholder="'+k[2]+'">';
    foot='<button class="cancel" onclick="close_()">やめる</button><button class="primary" onclick="doAdd(\''+modal.t+'\')">足す</button>';
  }

  if(modal.t==="me"){
    var exp=myExp(),next=null;
    LEVELS.forEach(function(l){if(!next&&l.need>exp)next=l});
    var pct=next?Math.min(100,Math.round((exp-lv.need)/(next.need-lv.need)*100)):100;
    body='<h3>Lv'+lv.lv+'　'+esc(lvTitle(lv))+'</h3>'
      +'<div class="meter"><i class="on" style="flex:'+pct+'"></i><i style="flex:'+(100-pct)+'"></i></div>'
      +'<p class="sub">'+exp+' pt'+(next?'／ Lv'+next.lv+' まで あと '+(next.need-exp)+' pt':'／ いちばん先まで来ました')+'</p>';
    if(next) body+='<div class="unlock"><b>Lv'+next.lv+' になると</b><br>'+esc(next.unlock)+'</div>';
    body+='<label>ポイントが入るとき</label>';
    POINT_RULES.forEach(function(r){body+='<div class="rule"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>'});
    body+='<p class="src" style="margin-top:10px">レベルは えらい順ではありません。'
      +'<b>できることが増える鍵</b>です。地図そのものを作りかえる権限は、たくさん調べた人から順に開きます。</p>'
      +'<label style="margin-top:18px">呼び名</label><input id="f_myname" maxlength="12" value="'+esc(me.name)+'">'
      +'<label style="margin-top:16px">外での反響を記録する</label>'
      +'<input id="f_what" placeholder="何が使われたか"><div style="height:6px"></div>'
      +'<input id="f_where" placeholder="どこで（自治体／学校／取材 など）">'
      +'<button class="take" onclick="doEcho()">記録する</button>';
    foot='<button class="cancel" onclick="close_()">閉じる</button><button class="primary" onclick="doMe()">保存する</button>';
  }

  if(modal.t==="look"){
    body='<h3>見た目とことば</h3><p class="sub">地図の位置と並びは全員そろえたまま、色・書体・質感・ことばだけ変わります。</p>'
      +'<label>ことば</label><div class="chips">'
      +'<button class="chip" aria-pressed="'+(me.lang==="y")+'" onclick="pick(\'lang\',\'y\')">やさしい</button>'
      +'<button class="chip" aria-pressed="'+(me.lang==="n")+'" onclick="pick(\'lang\',\'n\')">ふつう</button></div>'
      +'<label>色</label><div class="chips">';
    data.themes.forEach(function(t){
      var p=palette(t),bad=contrast(p.bg,p.ink)<4.5;
      body+='<button class="chip'+(bad?" warn":"")+'" aria-pressed="'+(me.theme===t.id)+'" onclick="pick(\'theme\',\''+t.id+'\')" '
        +'style="background:'+p.bg+';color:'+p.ink+';border-color:'+(me.theme===t.id?p.accent:p.edge)+'">'
        +'<span class="sw" style="background:'+p.accent+'"></span>'+esc(t.label)+(bad?' ⚠️':'')+'</button>'});
    body+='</div><label>書体</label><div class="chips">';
    data.fonts.forEach(function(f){loadFont(f);
      body+='<button class="chip" aria-pressed="'+(me.font===f.id)+'" style="font-family:'+f.stack+'" onclick="pick(\'font\',\''+f.id+'\')">'+esc(f.label)+'</button>'});
    body+='</div><label>質感</label><div class="chips">';
    Object.keys(TEXTURES).forEach(function(k2){
      body+='<button class="chip" aria-pressed="'+(me.texture===k2)+'" onclick="pick(\'texture\',\''+k2+'\')">'+TEXTURES[k2]+'</button>'});
    body+='</div><p class="src" style="margin-top:14px">質感はすべてCSSで描いた自前の模様です。既存ゲームの画像・書体は使っていません。</p>';
    foot='<button class="primary" onclick="close_()">閉じる</button>';
  }

  m.innerHTML=sheetWrap(body,foot);
  var sc=document.getElementById("f_src");
  if(sc) sc.addEventListener("input",updateSrcCount);
}

function updateSrcCount(){
  var el=document.getElementById("srcCount");if(!el)return;
  var list=splitSources(val("f_src")),u=new Set(list.map(normUrl));u.delete("");
  el.textContent=list.length?"出どころ "+u.size+"件として数えます":"";
}
function pick(k,v){me[k]=v;saveMe();authed?render():renderGate()}
function toggleChip(id){var b=document.getElementById("ck_"+id);b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}
function doSetup(){GAS_URL=val("f_gas").trim();LS.set("rfl4_gas",GAS_URL);close_();authed?pull():renderGate()}
function doMe(){me.name=val("f_myname").trim()||me.name;saveMe();close_();render()}
function doCard(){
  var list=splitSources(val("f_src")),raw=val("f_raw").trim(),err=document.getElementById("cardErr");
  if(!list.length){err.textContent="①の出どころを入れてください。ここだけは省けません。";return}
  if(!raw){err.textContent="②に、調べたことを貼ってください。";return}
  var before=density(data.cards.filter(function(c){return c.d===modal.d&&c.a===modal.a}));
  var pts=10+(before.s===0?15:before.s<=1?5:0)+(modal.answers?12:0);
  var b=document.getElementById("btn_submit");b.disabled=true;b.textContent="AIが読んでいます…";err.textContent="";
  api("addCard",{d:modal.d,a:modal.a,src:list.join("\n"),raw:raw,q:val("f_q").trim(),pts:pts,answers:modal.answers||""})
    .then(function(j){
      flash=modal.d+modal.a;setTimeout(function(){flash="";render()},600);
      var msg=before.s===0?"🗺 "+me.name+" が【"+labelOf(data.domains,modal.d)+" × "+labelOf(data.axes,modal.a)+"】をはじめて塗りました。+"+pts
                          :labelOf(data.domains,modal.d)+" × "+labelOf(data.axes,modal.a)+" が濃くなりました。+"+pts;
      if(j.judged===false) msg+="（AIの見立てはあとで入ります）";
      close_();toast(msg);return pull();
    })
    .catch(function(e){
      b.disabled=false;b.textContent="地図に置く";
      err.textContent="送れませんでした（"+e.message+"）。書いた内容は残っています。";
    });
}
function doCorrect(){
  var after=[],err=document.getElementById("fixErr");
  data.stages.concat(data.situations).forEach(function(s){
    var b=document.getElementById("ck_"+s.id);
    if(b&&b.getAttribute("aria-pressed")==="true") after.push(s.id);
  });
  var why=(document.querySelector('input[name="why"]:checked')||{}).value||"",note=val("f_note").trim();
  if(!why){err.textContent="「なぜ ちがう？」を選んでください。";return}
  if(why==="その他"&&!note){err.textContent="「その他」のときは、ひとこと書いてください。";return}
  var b=document.getElementById("btn_fix");b.disabled=true;b.textContent="送っています…";
  api("addCorrection",{cardId:modal.cardId,after:after,why:why,note:note})
    .then(function(){close_();toast("✏️ "+me.name+" がAIの見立てを直しました。+5");return pull()})
    .catch(function(e){b.disabled=false;b.textContent="直す（+5）";err.textContent="送れませんでした："+e.message});
}
function doComment(id){
  var t=val("cm_"+id).trim();if(!t)return;
  var d=modal.d,a=modal.a;
  api("addComment",{cardId:id,text:t}).then(function(){toast("コメントを残しました。");return pull()})
    .then(function(){open_("cell",{d:d,a:a})}).catch(function(e){toast("送れませんでした："+e.message)});
}
function doSummary(){
  var t=val("f_sum").trim();if(!t)return;
  api("addSummary",{key:modal.d+"|"+modal.a,text:t}).then(function(){close_();toast("まとめました。");return pull()})
    .catch(function(e){toast("送れませんでした："+e.message)});
}
function doAdd(kind){
  var v=val("f_label").trim();if(!v)return;
  api(kind,{label:v}).then(function(){close_();toast("「"+v+"」が地図に加わりました。名づけたのは "+me.name+"。");return pull()})
    .catch(function(e){toast("送れませんでした："+e.message)});
}
function doEcho(){
  var w=val("f_what").trim(),r=val("f_where").trim();if(!w||!r)return;
  api("addEcho",{what:w,where:r}).then(function(){close_();toast("反響を記録しました。");return pull()})
    .catch(function(e){toast("送れませんでした："+e.message)});
}

(function(){
  loadMe();
  var c=LS.get("rfl4_cache");if(c){try{data=Object.assign(data,JSON.parse(c))}catch(e){}}
  if(authed){render();pull()}else{renderGate()}
  setInterval(function(){if(authed&&!modal&&!picking)pull()},30000);
})();
</script>
</body>
</html>
